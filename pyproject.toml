[project]
name = "lead-enrichment-agent"
version = "0.1.0"
description = "An autonomous agent that researches companies and returns enriched, ICP-scored lead records with a visible research trace."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "selectolax>=0.3.21",
  "pyyaml>=6.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
lea = "lea.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
