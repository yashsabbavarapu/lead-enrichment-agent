# ICP profile for lead-enrichment-agent.
#
# Edit this file by hand — it is the whole point of keeping it as YAML.
#   criteria[].key      snake_case, unique; shown as the row label in the score table
#   criteria[].weight   relative importance; only the ratio matters, they are
#                       normalized at scoring time (so 2.0 vs 1.0 == 4.0 vs 2.0)
#   criteria[].rubric   plain-language anchors for 0 and 10. The more concrete
#                       these are, the more stable the scores across companies.
#   disqualifiers       any hit forces tier D and caps the score, regardless of
#                       how well the company scores elsewhere.
#
# Regenerate from real customers with:
#   lea icp infer --examples "Customer A, Customer B, Customer C" --out icp.yaml

name: default-b2b-saas-gtm
summary: 'PLACEHOLDER PROFILE — not derived from your customers. Models a B2B SaaS vendor selling workflow
  software to go-to-market teams (sales, marketing, RevOps) at venture-backed North American and Western
  European companies past product-market fit. Sweet spot: 50-500 employees, cloud-native stack, an in-house
  GTM org large enough to feel process pain, and a recent growth event (funding or GTM hiring) that creates
  budget and urgency. Run `lea icp infer --examples "Customer A, Customer B, Customer C"` to replace this
  with a rubric derived from real closed-won accounts.'
criteria:
- key: company_type
  description: A B2B software or tech-enabled services company that sells to other businesses.
  weight: 2.0
  rubric: 10 = pure-play B2B SaaS with a self-described product and pricing page. 7 = tech-enabled B2B
    services or B2B marketplace. 4 = hybrid B2B/B2C. 0 = consumer-only, public sector, non-profit, or
    a pure agency.
- key: gtm_segment
  description: Sells into a market that requires a real outbound/inbound GTM motion, with an identifiable
    sales org.
  weight: 2.0
  rubric: 10 = mid-market or enterprise sales motion with named AE/SDR/RevOps roles visible. 6 = mixed
    PLG plus sales-assist. 3 = pure self-serve PLG with no sales headcount. 0 = no discernible commercial
    GTM function.
- key: company_size
  description: Headcount in the 50-500 band, where GTM process pain is acute but procurement is still
    light.
  weight: 1.5
  rubric: 10 = 51-200 or 201-500 employees. 6 = 11-50 (early, may lack budget) or 501-1000 (may have incumbent
    tooling). 3 = 1001-5000. 1 = 1-10 or 5000+. Score 5 and say so if headcount is unknown.
- key: tech_maturity
  description: Cloud-native, modern data/GTM stack, and evidence they buy rather than build tooling.
  weight: 1.5
  rubric: 10 = modern CRM (Salesforce/HubSpot), a data warehouse, and 2+ best-of-breed SaaS tools detected.
    6 = a modern CRM or analytics stack visible. 3 = legacy or minimal stack. 0 = strong build-it-ourselves
    signal (in-house everything, no third-party tooling).
- key: growth_signals
  description: 'A recent trigger event that creates budget and urgency: funding, GTM hiring, expansion,
    or a product launch.'
  weight: 1.5
  rubric: 10 = funding round in the last 12 months AND open GTM roles. 7 = either one alone. 4 = older
    (12-24mo) growth signal only. 0 = layoffs, down round, acquisition, or no signal in 24 months.
- key: geo
  description: Headquartered in a market we can support and sell into today.
  weight: 1.0
  rubric: 10 = US, Canada, UK, or Western Europe. 6 = ANZ, Nordics, or Israel. 3 = elsewhere with an English-language
    site. 0 = a market with a data-residency or language barrier we cannot serve.
disqualifiers:
- Consumer-only (B2C) company with no business-facing product or sales motion.
- 'Direct competitor: sells GTM/sales-engagement/lead-enrichment software itself.'
- Publicly announced acquisition, wind-down, or major layoffs in the last 6 months.
